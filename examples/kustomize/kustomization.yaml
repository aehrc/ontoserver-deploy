# kustomization.yaml
# Example showing how to use Kustomize to add a priorityClassName to Ontoserver.
#
# Since priorityClassName is not currently a direct value in the Helm chart,
# Kustomize is an excellent tool for post-processing the Helm output.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# helmGlobals.chartHome defines the base directory for local Helm charts.
# This avoids path resolution bugs in some Kustomize versions when name contains slashes.
helmGlobals:
  chartHome: ../../charts

# This block enables Kustomize to inflate the Helm chart directly.
# Requires 'kubectl kustomize . --enable-helm --load-restrictor LoadRestrictionsNone'
helmCharts:
  - name: ontoserver
    releaseName: ontoserver
    # Explicitly providing a values file avoids a Kustomize bug with local charts
    valuesFile: values.yaml

patches:
  - target:
      kind: Deployment
      # The chart generates labels as 'app: {{ .Release.Name }}-ontoserver'
      # With releaseName 'ontoserver', the label is 'app=ontoserver-ontoserver'
      labelSelector: "app=ontoserver-ontoserver"
    patch: |
      - op: add
        path: /spec/template/spec/priorityClassName
        value: system-cluster-critical
  - target:
      kind: StatefulSet
      labelSelector: "app=ontoserver-ontoserver"
    patch: |
      - op: add
        path: /spec/template/spec/priorityClassName
        value: system-cluster-critical
