# networking/single-ro-eks-envoy-gateway-nlb.yaml
# Single read-only Ontoserver on Amazon EKS.
# Networking: Gateway API with Envoy Gateway behind an AWS Network Load Balancer (NLB).
#
# This configuration uses PROXY protocol v2 to preserve real client IPs through
# the NLB — required when client IP is needed for audit logging, GeoIP
# restrictions, or IP-based access control.
#
# IMPORTANT: PROXY protocol must be enabled on the NLB target group BEFORE
# enabling it here. Mismatched settings will cause all connections to fail.
# See: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-target-groups.html#proxy-protocol
#
# If you don't need real client IP preservation, use eks/single-ro-envoy.yaml
# which is simpler (no NLB / PROXY protocol setup required).
#
# ── Prerequisites ─────────────────────────────────────────────────────────────
#   - EBS CSI driver add-on enabled
#   - Envoy Gateway installed:
#       kubectl apply -f https://github.com/envoyproxy/gateway/releases/download/v1.3.1/install.yaml
#   - AWS Load Balancer Controller installed (manages the NLB)
#   - NLB target group configured with PROXY protocol v2 enabled
#   - cert-manager installed (optional, for TLS)
#
# Usage:
#   helm install my-ontoserver ./charts/ontoserver -f networking/single-ro-eks-envoy-gateway-nlb.yaml \
#     --set ontoserver.imageCredentials.username=<quay-username> \
#     --set ontoserver.imageCredentials.password=<quay-password>

ontoserver:
  serverName: ontoserver.example.com
  hostNames:
    - ontoserver.example.com

  deployment:
    # Image pull auth:
    # - preferred for production: create a docker-registry Secret and reference it here
    # - alternative: pass ontoserver.imageCredentials.username/password via --set at install time
    imagePullSecrets:
      - name: ontoserver-quay-pull-secret
    kind: Deployment
    type: single
    image: quay.io/aehrc/ontoserver:ctsa-6
    replicas: 1
    isReadOnly: true

    db:
      enabled: true
      postgresVersion: 16

    persistence:
      enabledForDeployment: true
      mode: split
      files:
        accessMode: ReadWriteOnce
        storageSize: 20G
        storageClass:
          provided:
            enabled: true
            storageProvisioner: ebs.csi.aws.com
            reclaimPolicy: Retain
            allowVolumeExpansion: true
            storageParameters:
              skuName: ""
              kind: ""
              type: gp3
              encrypted: "true"
      dbfiles:
        accessMode: ReadWriteOnce
        storageSize: 10G
        storageClass:
          provided:
            enabled: true
            storageProvisioner: ebs.csi.aws.com
            reclaimPolicy: Retain
            allowVolumeExpansion: true
            storageParameters:
              skuName: ""
              kind: ""
              type: gp3
              encrypted: "true"

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ontoserver-role

  nodeSelector:
    eks.amazonaws.com/nodegroup: ontoserver-nodes

  gateway:
    enabled: true
    className: envoy-gateway-class

  # ── TLS ───────────────────────────────────────────────────────────────────
  # Ontoserver must not be served over plaintext HTTP. Supply the certificate as a
  # Kubernetes TLS Secret named by certRef, or uncomment certmanager below to have
  # cert-manager issue and populate that Secret for you.
  tls:
    enabled: true
    certRef: ontoserver-tls
  # certmanager:
  #   enabled: true
  #   clusterIssuerName: letsencrypt-prod
  #   email: your-email@example.com

  resources:
    ontoserver:
      requests:
        cpu: 2
        memory: 4G
      limits:
        cpu: 2
        memory: 4G
      initialHeapSize: 2800m
      maxHeapSize: 2800m
    db:
      requests:
        cpu: 1
        memory: 1G
      limits:
        cpu: 1
        memory: 1G

  # ── Preload ───────────────────────────────────────────────────────────────
  # config:
  #   atom.preload.feedLocation: "file:///data/preload.xml"
  # healthCheckOption: -s

# ── Envoy Gateway traffic policies ────────────────────────────────────────
# ClientTrafficPolicy enables PROXY protocol so real client IPs are preserved
# through the NLB. numTrustedHops: 0 tells Envoy to use the peer address
# from the PROXY protocol header rather than X-Forwarded-For.
#
# IMPORTANT: enableProxyProtocol must match the NLB target group setting.
envoygateway:
  clientTrafficPolicy:
    enabled: true
    idleTimeout: 300s
    proxyProtocol:
      enabled: true
    clientIPDetection:
      xForwardedFor:
        numTrustedHops: 0

  # Uncomment to add request size limiting and rate limiting.
  # backendTrafficPolicy:
  #   enabled: true
  #   requestBufferLimit: 1Gi
  #   rateLimit:
  #     requests: 50
  #     unit: Second

  # Uncomment to deny traffic from specific CIDRs.
  # securityPolicy:
  #   enabled: true
  #   defaultAction: Allow
  #   deniedCIDRs:
  #     - 192.0.2.0/24
