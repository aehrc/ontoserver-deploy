# networking/single-ro-eks-alb.yaml
# Single read-only Ontoserver on Amazon EKS.
# Networking: AWS Application Load Balancer (ALB) via AWS Load Balancer Controller.
#
# TLS is terminated at the ALB using an ACM certificate — no in-cluster
# certificate management required. Use this when you prefer ALB over
# Envoy Gateway, or when your organisation already manages certificates in ACM.
#
# For Envoy Gateway on EKS (recommended, enables traffic policies) see
# eks/single-ro-envoy.yaml or networking/single-ro-eks-envoy-gateway-nlb.yaml.
#
# ── Prerequisites ─────────────────────────────────────────────────────────────
#   - EBS CSI driver add-on enabled
#   - AWS Load Balancer Controller installed:
#       https://docs.aws.amazon.com/eks/latest/userguide/aws-load-balancer-controller.html
#   - ACM certificate provisioned for your domain
#   - External Secrets Operator installed (optional, for AWS Secrets Manager)
#
# Usage:
#   helm install my-ontoserver ./charts/ontoserver -f networking/single-ro-eks-alb.yaml

ontoserver:
  imageCredentials:
    username: ""   # quay.io username
    password: ""   # quay.io password

  serverName: ontoserver.example.com
  hostNames:
    - ontoserver.example.com

  deployment:
    kind: Deployment
    type: single
    image: quay.io/aehrc/ontoserver:ctsa-6
    replicas: 1
    isReadOnly: true

    db:
      enabled: true
      postgresVersion: 16

    persistence:
      enabledForDeployment: true
      mode: split
      files:
        accessMode: ReadWriteOnce
        storageClass:
          provided:
            enabled: true
            storageProvisioner: ebs.csi.aws.com
            reclaimPolicy: Retain
            allowVolumeExpansion: true
            storageParameters:
              skuName: ""
              kind: ""
              type: gp3
              encrypted: "true"
      dbfiles:
        accessMode: ReadWriteOnce
        storageClass:
          provided:
            enabled: true
            storageProvisioner: ebs.csi.aws.com
            reclaimPolicy: Retain
            allowVolumeExpansion: true
            storageParameters:
              skuName: ""
              kind: ""
              type: gp3
              encrypted: "true"

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ontoserver-role

  nodeSelector:
    eks.amazonaws.com/nodegroup: ontoserver-nodes

  # ALB ingress — TLS terminated at the load balancer using an ACM certificate.
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:123456789012:certificate/your-cert-id

  # TLS is handled by the ALB — no in-cluster TLS secret needed.
  tls:
    enabled: false

  resources:
    ontoserver:
      requests:
        cpu: 2
        memory: 4G
        storage: 20G
      limits:
        cpu: 2
        memory: 4G
      initialHeapSize: 2800m
      maxHeapSize: 2800m
    db:
      requests:
        cpu: 1
        memory: 1G
        storage: 10G
      limits:
        cpu: 1
        memory: 1G

  # ── Preload ───────────────────────────────────────────────────────────────
  # config:
  #   atom.preload.feedLocation: "file:///data/preload.xml"
  # healthCheckOption: -s

  # ── External Secrets (optional) ───────────────────────────────────────────
  # externalSecret:
  #   enabled: true
  #   secretStoreRef:
  #     name: aws-secrets-manager
  #     kind: ClusterSecretStore
