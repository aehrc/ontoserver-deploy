apiVersion: v2
name: ontoserver
description: Ontoserver FHIR terminology server helm chart with various
  deployment configurations
type: application
version: 0.6.0
appVersion: "ctsa-6"
home: https://ontoserver.csiro.au
icon: https://raw.githubusercontent.com/aehrc/ontoserver-deploy/master/icons/ontoserver.png
sources:
  - https://github.com/aehrc/ontoserver-deploy
keywords:
  - fhir
  - terminology
  - ontoserver
  - hl7
maintainers:
  - name: CSIRO
    email: ontoserver-support@csiro.au
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  # Describes the version in `version:` above — which is the LAST RELEASED version under Release
  # Please, not an in-development one. Release Please bumps `version:` but does NOT touch this list,
  # so update it in the release PR before merging or it will silently describe the previous release.
  artifacthub.io/changes: |
    - kind: added
      description: 'envoygateway.backendTrafficPolicy.ipRateLimits - per-client-IP rate limits on the BackendTrafficPolicy, by CIDR, with a Distinct (bucket per IP) or Exact (shared bucket) type. Defaults to empty'
    - kind: added
      description: 'envoygateway.backendTrafficPolicy.pathRateLimits - per-path rate limits matched by regular expression, one bucket shared by all clients. Defaults to empty'
    - kind: fixed
      description: 'An external database whose spring.datasource.username comes from existingSecretConfig or externalSecret no longer fails to render'
