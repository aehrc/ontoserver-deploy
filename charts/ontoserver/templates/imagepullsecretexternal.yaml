{{- $ipsUsername := .Values.ontoserver.externalSecret.imagePullSecret.data.username.key }}
{{- $ipsPassword := .Values.ontoserver.externalSecret.imagePullSecret.data.password.key }}
{{- if and $ipsUsername $ipsPassword }}
{{- $storeRef := .Values.ontoserver.externalSecret.imagePullSecret.secretStoreRef }}
{{- $fallbackRef := .Values.ontoserver.externalSecret.secretStoreRef }}
{{- $storeName := $storeRef.name | default $fallbackRef.name }}
{{- $storeKind := $storeRef.kind | default $fallbackRef.kind | default "ClusterSecretStore" }}
{{- if empty $storeName }}
  {{- fail "ontoserver.externalSecret.imagePullSecret: secretStoreRef.name (or ontoserver.externalSecret.secretStoreRef.name) is required" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-ontoserver-pull-secret-external-sync
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.ontoserver.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $storeKind }}
  target:
    name: {{ .Release.Name }}-ontoserver-pull-secret-external
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        {{- /* The placeholders are deliberately NOT wrapped in quotes: `toJson` supplies its own,
             and escapes any `"` or `\` in the value. Quoting them by hand — as this did — means a
             password containing either character produces a corrupt .dockerconfigjson, which the
             kubelet reports only as an opaque ImagePullBackOff. Same fix as imagepullsecret.yaml,
             but applied inside the template External Secrets renders rather than at Helm render
             time, so it relies on the sprig functions available to ESO's v2 template engine (the
             only engine for the external-secrets.io/v1 API).

             Note this path is not covered by the integration tests — they run without External
             Secrets installed — so it is verified by unit tests on the rendered template only. */}}
        .dockerconfigjson: |
          {"auths":{ {{ .Values.ontoserver.imageCredentials.registry | toJson }}: {"username":{{`{{ .username | toJson }}`}},"password":{{`{{ .password | toJson }}`}}} }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.ontoserver.externalSecret.imagePullSecret.data.username.key }}
        {{- with .Values.ontoserver.externalSecret.imagePullSecret.data.username.property }}
        property: {{ . }}
        {{- end }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.ontoserver.externalSecret.imagePullSecret.data.password.key }}
        {{- with .Values.ontoserver.externalSecret.imagePullSecret.data.password.property }}
        property: {{ . }}
        {{- end }}
{{- end }}
