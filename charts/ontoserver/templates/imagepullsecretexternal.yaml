{{- $ipsUsername := .Values.ontoserver.externalSecret.imagePullSecret.data.username.key }}
{{- $ipsPassword := .Values.ontoserver.externalSecret.imagePullSecret.data.password.key }}
{{- if and $ipsUsername $ipsPassword }}
{{- $storeRef := .Values.ontoserver.externalSecret.imagePullSecret.secretStoreRef }}
{{- $fallbackRef := .Values.ontoserver.externalSecret.secretStoreRef }}
{{- $storeName := $storeRef.name | default $fallbackRef.name }}
{{- $storeKind := $storeRef.kind | default $fallbackRef.kind | default "ClusterSecretStore" }}
{{- if empty $storeName }}
  {{- fail "ontoserver.externalSecret.imagePullSecret: secretStoreRef.name (or ontoserver.externalSecret.secretStoreRef.name) is required" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-ontoserver-pull-secret-external-sync
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.ontoserver.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $storeKind }}
  target:
    name: {{ .Release.Name }}-ontoserver-pull-secret-external
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .Values.ontoserver.imageCredentials.registry }}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.ontoserver.externalSecret.imagePullSecret.data.username.key }}
        {{- with .Values.ontoserver.externalSecret.imagePullSecret.data.username.property }}
        property: {{ . }}
        {{- end }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.ontoserver.externalSecret.imagePullSecret.data.password.key }}
        {{- with .Values.ontoserver.externalSecret.imagePullSecret.data.password.property }}
        property: {{ . }}
        {{- end }}
{{- end }}
