{{- if and .Values.ontoserver.imageCredentials.username .Values.ontoserver.imageCredentials.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ontoserver-pull-secret
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.ontoserver.imageCredentials.registry .Values.ontoserver.imageCredentials.username .Values.ontoserver.imageCredentials.password (printf "%s:%s" .Values.ontoserver.imageCredentials.username .Values.ontoserver.imageCredentials.password | b64enc) | b64enc }}
{{- end }}
