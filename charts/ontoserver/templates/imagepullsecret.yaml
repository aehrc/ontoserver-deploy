{{- if and .Values.ontoserver.imageCredentials.username .Values.ontoserver.imageCredentials.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ontoserver-pull-secret
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  {{- /* Built with dict + toJson rather than printf. The previous version interpolated the
       username and password straight into a JSON string literal, so a single `"` or `\` in
       either — legal in a registry password, and common in generated ones — produced a corrupt
       .dockerconfigjson. The kubelet surfaces that only as an opaque ImagePullBackOff, with the
       parse error buried in the node's log. toJson escapes both correctly.

       The registry is the map key, so it is escaped too: an empty or malformed registry value
       can no longer break out of the structure. */ -}}
  {{- $creds := .Values.ontoserver.imageCredentials }}
  {{- $auth := printf "%s:%s" $creds.username $creds.password | b64enc }}
  {{- $config := dict "auths" (dict $creds.registry (dict "username" $creds.username "password" $creds.password "auth" $auth)) }}
  .dockerconfigjson: {{ $config | toJson | b64enc }}
{{- end }}
