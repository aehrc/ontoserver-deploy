{{- if and .Values.envoygateway.createGatewayClass .Values.ontoserver.gateway.enabled }}
{{- $controllerNs := .Values.envoygateway.controlPlaneNamespace | default "envoy-gateway-system" }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.ontoserver.gateway.className }}
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.envoygateway.envoyProxy.name | default "default" }}
    namespace: {{ $controllerNs }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoygateway.envoyProxy.name | default "default" }}
  namespace: {{ $controllerNs }}
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        {{- /* `| default` is wrong for both fields below: 0 is falsy in Go templates, so a
             deliberate 0 was silently replaced by the default. Scaling the Envoy fleet to 0 and
             a PDB that permits full eviction are both legitimate, and values.yaml supplies the
             defaults anyway — so use the value as given and only fall back when it is genuinely
             unset. `pdbIsSet` exists because `empty 0` is true and would conflate the two. */}}
        replicas: {{ if include "ontoserver.pdbIsSet" .Values.envoygateway.envoyProxy.replicas }}{{ .Values.envoygateway.envoyProxy.replicas }}{{ else }}2{{ end }}
      envoyPDB:
        {{- /* Rendered through pdbValue, the same IntOrString helper the PodDisruptionBudget
             template uses, so there is one code path for this field type. Unlike there, the
             quoting is not load-bearing here — an unquoted 25% parses to the same string — so
             this is consistency and future-proofing, not a fix. */}}
        minAvailable: {{ if include "ontoserver.pdbIsSet" .Values.envoygateway.envoyProxy.pdbMinAvailable }}{{ include "ontoserver.pdbValue" .Values.envoygateway.envoyProxy.pdbMinAvailable }}{{ else }}1{{ end }}
      envoyService:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "metrics"
          prometheus.io/path: "/stats/prometheus"
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: metrics
                  port: 19001
                  targetPort: 19001
                - name: admin
                  port: 19000
                  targetPort: 19000
  {{- if .Values.envoygateway.envoyProxy.accessLog.enabled }}
  telemetry:
    accessLog:
      settings:
        - format:
            type: Text
            text: |-
              {{ .Values.envoygateway.envoyProxy.accessLog.format | trim }}
          sinks:
            - type: File
              file:
                path: /dev/stdout
  {{- end }}
{{- end }}
