{{- if gt (len .Values.ontoserver.secretConfig) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ontoserver-secrets
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.ontoserver.secretConfig }}
  {{- /* toString before b64enc: b64enc rejects non-strings outright, and its error names only
       <b64enc> rather than the offending key. Every one of these becomes an environment variable
       (a string) in the container anyway, and the sibling `ontoserver.config` already coerces via
       `| quote`, so a numeric port or a boolean flag must not be the difference between the two. */}}
  {{ $key }}: {{ $value | toString | b64enc }}
  {{- end }}
{{- end }}
