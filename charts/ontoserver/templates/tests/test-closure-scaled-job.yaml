{{- if and (eq .Values.ontoserver.deployment.kind "StatefulSet") (eq .Values.ontoserver.deployment.type "scaled") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ontoserver-test-closure-scaled-script
data:
  test.sh: |
    #!/bin/sh
    set -e

    POD0_SVC="http://{{ .Release.Name }}-ontoserver-pod0-service"
    POD0_DNS="http://{{ .Release.Name }}-statefulset-0.{{ .Release.Name }}-ontoserver-headless:{{ .Values.ontoserver.deployment.containerPort }}"
    POD1_DNS="http://{{ .Release.Name }}-statefulset-1.{{ .Release.Name }}-ontoserver-headless:{{ .Values.ontoserver.deployment.containerPort }}"
    PASS=0
    FAIL=0

    check() {
      local desc="$1"
      local result="$2"
      if [ "$result" = "ok" ]; then
        echo "  PASS: $desc"
        PASS=$((PASS+1))
      else
        echo "  FAIL: $desc -- $result"
        FAIL=$((FAIL+1))
      fi
    }

    http_get() {
      curl -s -o /tmp/response.json -w "%{http_code}" \
        -H "Accept: application/fhir+json" \
        "$1" || echo "000"
    }

    echo "=== Test: Both pods reachable via headless DNS ==="
    CODE=$(http_get "$POD0_DNS/fhir/metadata")
    check "pod-0 /fhir/metadata returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    CODE=$(http_get "$POD1_DNS/fhir/metadata")
    check "pod-1 /fhir/metadata returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"

    echo "=== Test: pod0-service routes to pod-0 ==="
    CODE=$(http_get "$POD0_SVC/fhir/metadata")
    check "pod0-service /fhir/metadata returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"

    echo "=== Test: \$closure via pod0-service ==="
    # Initialise a closure table via the pod-0 dedicated service
    CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
      -X POST \
      -H "Content-Type: application/fhir+json" \
      -H "Accept: application/fhir+json" \
      --data-binary '{"resourceType":"Parameters","parameter":[{"name":"name","valueString":"test-closure-scaled"}]}' \
      "$POD0_SVC/fhir/\$closure" || echo "000")
    check "\$closure init via pod0-service returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "\$closure init returns ConceptMap" "$(grep -q '"resourceType":"ConceptMap"' /tmp/response.json && echo ok || echo "not found")"

    # Subsequent call on the same table — must return 200 and the same closure ConceptMap
    CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
      -X POST \
      -H "Content-Type: application/fhir+json" \
      -H "Accept: application/fhir+json" \
      --data-binary '{"resourceType":"Parameters","parameter":[{"name":"name","valueString":"test-closure-scaled"}]}' \
      "$POD0_SVC/fhir/\$closure" || echo "000")
    check "\$closure second call via pod0-service returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"

    echo "=== Test: \$closure via pod-0 headless DNS ==="
    # Direct call to pod-0 must recognise the table initialised above
    CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
      -X POST \
      -H "Content-Type: application/fhir+json" \
      -H "Accept: application/fhir+json" \
      --data-binary '{"resourceType":"Parameters","parameter":[{"name":"name","valueString":"test-closure-scaled"}]}' \
      "$POD0_DNS/fhir/\$closure" || echo "000")
    check "\$closure via pod-0 headless DNS returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"

    echo ""
    echo "Results: $PASS passed, $FAIL failed"
    [ "$FAIL" = "0" ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ontoserver-test-closure-scaled
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.ontoserver.tests.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-ontoserver-test-closure-scaled-script
            defaultMode: 0755
      containers:
        - name: test
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/test.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
{{- end }}
