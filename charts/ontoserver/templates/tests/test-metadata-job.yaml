apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ontoserver-test-metadata-script
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
data:
  test.sh: |
    #!/bin/sh
    set -e

    BASE_URL="http://{{ .Release.Name }}-ontoserver-service"
    PASS=0
    FAIL=0

    check() {
      local desc="$1"
      local result="$2"
      if [ "$result" = "ok" ]; then
        echo "  PASS: $desc"
        PASS=$((PASS+1))
      else
        echo "  FAIL: $desc -- $result"
        FAIL=$((FAIL+1))
      fi
    }

    http_get() {
      curl -s -o /tmp/response.json -w "%{http_code}" "$1" || echo "000"
    }

    echo "=== Test: FHIR CapabilityStatement ==="
    CODE=$(http_get "$BASE_URL/fhir/metadata")
    check "GET /fhir/metadata returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "resourceType is CapabilityStatement" "$(grep -q '"resourceType":"CapabilityStatement"' /tmp/response.json && echo ok || echo "not found")"
    check "status is active" "$(grep -q '"status":"active"' /tmp/response.json && echo ok || echo "not found")"
    check "fhirVersion is supported (R4 or R5)" "$(grep -Eq '"fhirVersion":"(4\.0|5\.0)' /tmp/response.json && echo ok || echo "not found")"
    check "CodeSystem lookup operation advertised" "$(grep -q '"lookup"' /tmp/response.json && echo ok || echo "not found")"
    check "ValueSet expand operation advertised" "$(grep -q '"expand"' /tmp/response.json && echo ok || echo "not found")"
    check "ConceptMap translate operation advertised" "$(grep -q '"translate"' /tmp/response.json && echo ok || echo "not found")"
    {{- if .Values.ontoserver.managementService.enabled }}

    MGMT_URL="http://{{ .Release.Name }}-ontoserver-management-service"

    echo "=== Test: Management API ==="
    CODE=$(http_get "$MGMT_URL/actuator/health")
    check "GET /actuator/health returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "health status is UP" "$(grep -q '"status":"UP"' /tmp/response.json && echo ok || echo "not found")"

    {{- end }}

    echo ""
    echo "Results: $PASS passed, $FAIL failed"
    [ "$FAIL" = "0" ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ontoserver-test-metadata
  labels:
    {{- include "ontoserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.ontoserver.tests.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-ontoserver-test-metadata-script
            defaultMode: 0755
      containers:
        - name: test
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/test.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
