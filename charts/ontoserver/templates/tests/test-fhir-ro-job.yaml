{{- if .Values.ontoserver.deployment.isReadOnly }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ontoserver-test-ro-script
data:
  test.sh: |
    #!/bin/sh
    set -e

    BASE_URL="http://{{ .Release.Name }}-ontoserver-service"
    PASS=0
    FAIL=0

    check() {
      local desc="$1"
      local result="$2"
      if [ "$result" = "ok" ]; then
        echo "  PASS: $desc"
        PASS=$((PASS+1))
      else
        echo "  FAIL: $desc -- $result"
        FAIL=$((FAIL+1))
      fi
    }

    http_post() {
      curl -s -o /tmp/response.json -w "%{http_code}" \
        -X POST \
        -H "Content-Type: application/fhir+json" \
        -H "Accept: application/fhir+json" \
        --data-binary "$2" \
        "$1" || echo "000"
    }

    http_get() {
      curl -s -o /tmp/response.json -w "%{http_code}" \
        -H "Accept: application/fhir+json" \
        "$1" || echo "000"
    }

    echo "=== Test: Read-only mode rejects write operations ==="

    CODESYSTEM_PAYLOAD='{"resourceType":"CodeSystem","url":"http://example.org/fhir/CodeSystem/ro-test-cs","version":"1.0.0","name":"ROTestCodeSystem","status":"active","content":"complete","concept":[{"code":"code-a","display":"Code A"}]}'
    CODE=$(http_post "$BASE_URL/fhir/CodeSystem" "$CODESYSTEM_PAYLOAD")
    check "POST CodeSystem is rejected with 4xx" "$(case "$CODE" in 4*) echo ok ;; *) echo "http $CODE" ;; esac)"
    echo "  Response code: $CODE"

    VALUESET_PAYLOAD='{"resourceType":"ValueSet","url":"http://example.org/fhir/ValueSet/ro-test-vs","version":"1.0.0","name":"ROTestValueSet","status":"active","compose":{"include":[{"system":"http://example.org/fhir/CodeSystem/ro-test-cs"}]}}'
    CODE=$(http_post "$BASE_URL/fhir/ValueSet" "$VALUESET_PAYLOAD")
    check "POST ValueSet is rejected with 4xx" "$(case "$CODE" in 4*) echo ok ;; *) echo "http $CODE" ;; esac)"
    echo "  Response code: $CODE"

    echo "=== Test: Read operations still work ==="
    CODE=$(http_get "$BASE_URL/fhir/metadata")
    check "GET metadata returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "metadata returns CapabilityStatement" "$(grep -q '"resourceType":"CapabilityStatement"' /tmp/response.json && echo ok || echo "not found")"

    CODE=$(http_get "$BASE_URL/fhir/CodeSystem")
    check "GET CodeSystem search returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "CodeSystem search returns Bundle" "$(grep -q '"resourceType":"Bundle"' /tmp/response.json && echo ok || echo "not found")"

    CODE=$(http_get "$BASE_URL/fhir/ValueSet")
    check "GET ValueSet search returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "ValueSet search returns Bundle" "$(grep -q '"resourceType":"Bundle"' /tmp/response.json && echo ok || echo "not found")"

    CODE=$(http_get "$BASE_URL/fhir/ConceptMap")
    check "GET ConceptMap search returns 200" "$([ "$CODE" = "200" ] && echo ok || echo "http $CODE")"
    check "ConceptMap search returns Bundle" "$(grep -q '"resourceType":"Bundle"' /tmp/response.json && echo ok || echo "not found")"

    echo ""
    echo "Results: $PASS passed, $FAIL failed"
    [ "$FAIL" = "0" ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ontoserver-test-fhir-ro
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.ontoserver.tests.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-ontoserver-test-ro-script
            defaultMode: 0755
      containers:
        - name: test
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/test.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
{{- end }}
