suite: Networking template tests
tests:
  - it: renders no Ingress by default
    templates:
      - templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Ingress when ingress.enabled=true
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-ingress
      - equal:
          path: spec.ingressClassName
          value: ontoserver-nginx

  - it: Ingress rules use hostNames
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: myserver.example.com

  - it: renders no Gateway by default
    templates:
      - templates/gateway.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Gateway when gateway.enabled=true
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
    asserts:
      - isKind:
          of: Gateway
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gw
        documentIndex: 0
      - isKind:
          of: HTTPRoute
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-route
        documentIndex: 1

  - it: quotes wildcard hostnames in Gateway resources
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
      ontoserver.hostNames:
        - "*.example.com"
      ontoserver.serverName: "*.example.com"
    asserts:
      - equal:
          path: spec.listeners[0].hostname
          value: "*.example.com"
        documentIndex: 0
      - equal:
          path: spec.hostnames[0]
          value: "*.example.com"
        documentIndex: 1

  - it: uses clusterIssuerName consistently for Gateway cert-manager resources
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
      ontoserver.certmanager.enabled: true
      ontoserver.certmanager.clusterIssuerName: letsencrypt-prod
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/issuer"]
          value: letsencrypt-prod-RELEASE-NAME
        documentIndex: 0
      - equal:
          path: metadata.name
          value: letsencrypt-prod-RELEASE-NAME
        documentIndex: 2

  - it: renders ClusterIP Service by default
    templates:
      - templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-service
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
      - equal:
          path: spec.type
          value: ClusterIP

  - it: renders pod0 Service for scaled StatefulSet
    templates:
      - templates/service.yaml
    set:
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-pod0-service
        documentIndex: 3
      - isSubset:
          path: spec.selector
          content:
            "statefulset.kubernetes.io/pod-name": RELEASE-NAME-statefulset-0
        documentIndex: 3

  - it: does not render pod0 Service for single StatefulSet
    templates:
      - templates/service.yaml
    set:
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: single
    asserts:
      - hasDocuments:
          count: 2

  - it: does not render pod0 Service for Deployment
    templates:
      - templates/service.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: Gateway renders separate closure HTTPRoute for scaled StatefulSet
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: HTTPRoute
        documentIndex: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-closure-route
        documentIndex: 2
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /fhir/ConceptMap/$closure
        documentIndex: 2
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-ontoserver-pod0-service
        documentIndex: 2
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
        documentIndex: 1

  - it: Gateway closure HTTPRoute uses backendServiceNameOverride when set with scaled StatefulSet
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
      ontoserver.gateway.backendServiceNameOverride: my-varnish-service
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-varnish-service
        documentIndex: 2

  - it: Gateway HTTPRoute has no closure route for single StatefulSet
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: single
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
        documentIndex: 1

  - it: Ingress adds closure path for scaled StatefulSet
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /fhir/ConceptMap/$closure
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-ontoserver-pod0-service
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /

  - it: Ingress uses backendServiceNameOverride when set
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
      ontoserver.hostNames:
        - localhost
      ontoserver.serverName: localhost
      ontoserver.ingress.backendServiceNameOverride: ontoserver-dev-varnish-service
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: ontoserver-dev-varnish-service

  - it: Ingress closure path uses backendServiceNameOverride when set with scaled StatefulSet
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
      ontoserver.ingress.backendServiceNameOverride: my-varnish-service
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /fhir/ConceptMap/$closure
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: my-varnish-service

  - it: Ingress has no closure path for single StatefulSet
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: single
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /

  # ── Traefik IngressRoute ──────────────────────────────────────────────────

  - it: renders no IngressRoute by default
    templates:
      - templates/traefik-ingressroute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders IngressRoute when traefik.ingressRoute.enabled=true
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
    asserts:
      - isKind:
          of: IngressRoute
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-ingressroute
      - equal:
          path: spec.entryPoints[0]
          value: websecure

  - it: IngressRoute uses hostNames for route match
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    asserts:
      - matchRegex:
          path: spec.routes[0].match
          pattern: "myserver\\.example\\.com"

  - it: IngressRoute includes TLS secretName when tls.enabled
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      ontoserver.tls.enabled: true
      ontoserver.tls.certRef: my-tls-secret
    asserts:
      - equal:
          path: spec.tls.secretName
          value: my-tls-secret

  - it: IngressRoute routes to default backend service
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
    asserts:
      - equal:
          path: spec.routes[0].services[0].name
          value: RELEASE-NAME-ontoserver-service
      - equal:
          path: spec.routes[0].services[0].port
          value: 80

  - it: IngressRoute uses backendServiceNameOverride when set
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      traefik.ingressRoute.backendServiceNameOverride: my-varnish-service
    asserts:
      - equal:
          path: spec.routes[0].services[0].name
          value: my-varnish-service

  - it: IngressRoute sets scheme when backendScheme is configured
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      traefik.ingressRoute.backendPort: 443
      traefik.ingressRoute.backendScheme: https
    asserts:
      - equal:
          path: spec.routes[0].services[0].scheme
          value: https
      - equal:
          path: spec.routes[0].services[0].port
          value: 443

  - it: IngressRoute references serversTransport when enabled
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      traefik.ingressRoute.serversTransport.enabled: true
    asserts:
      - equal:
          path: spec.routes[0].services[0].serversTransport
          value: RELEASE-NAME-ontoserver-serverstransport

  - it: IngressRoute adds closure route for scaled StatefulSet
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - matchRegex:
          path: spec.routes[0].match
          pattern: "\\$closure"
      - equal:
          path: spec.routes[0].services[0].name
          value: RELEASE-NAME-ontoserver-pod0-service
      - matchRegex:
          path: spec.routes[1].match
          pattern: "Host\\("
      - equal:
          path: spec.routes[1].services[0].name
          value: RELEASE-NAME-ontoserver-service

  - it: IngressRoute closure route uses backendServiceNameOverride when set with scaled StatefulSet
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      ontoserver.deployment.kind: StatefulSet
      ontoserver.deployment.type: scaled
      ontoserver.deployment.replicas: 2
      ontoserver.deployment.db.enabled: false
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
      traefik.ingressRoute.backendServiceNameOverride: my-varnish-service
    values:
      - fixtures/external-db-values.yaml
    asserts:
      - matchRegex:
          path: spec.routes[0].match
          pattern: "\\$closure"
      - equal:
          path: spec.routes[0].services[0].name
          value: my-varnish-service

  - it: IngressRoute has no closure route for single Deployment
    templates:
      - templates/traefik-ingressroute.yaml
    set:
      traefik.ingressRoute.enabled: true
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    asserts:
      - notMatchRegex:
          path: spec.routes[0].match
          pattern: "\\$closure"

  # ── Traefik ServersTransport ──────────────────────────────────────────────

  - it: renders no ServersTransport by default
    templates:
      - templates/traefik-serverstransport.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no ServersTransport when ingressRoute enabled but serversTransport disabled
    templates:
      - templates/traefik-serverstransport.yaml
    set:
      traefik.ingressRoute.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders ServersTransport when ingressRoute and serversTransport both enabled
    templates:
      - templates/traefik-serverstransport.yaml
    set:
      traefik.ingressRoute.enabled: true
      traefik.ingressRoute.serversTransport.enabled: true
    asserts:
      - isKind:
          of: ServersTransport
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-serverstransport

  - it: ServersTransport sets insecureSkipVerify=true when configured
    templates:
      - templates/traefik-serverstransport.yaml
    set:
      traefik.ingressRoute.enabled: true
      traefik.ingressRoute.serversTransport.enabled: true
      traefik.ingressRoute.serversTransport.insecureSkipVerify: true
    asserts:
      - equal:
          path: spec.insecureSkipVerify
          value: true

  - it: ServersTransport includes rootCAsSecrets when provided
    templates:
      - templates/traefik-serverstransport.yaml
    set:
      traefik.ingressRoute.enabled: true
      traefik.ingressRoute.serversTransport.enabled: true
      traefik.ingressRoute.serversTransport.rootCAsSecrets:
        - my-ca-secret
    asserts:
      - equal:
          path: spec.rootCAsSecrets[0]
          value: my-ca-secret
