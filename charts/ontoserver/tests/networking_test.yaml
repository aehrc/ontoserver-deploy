suite: Networking template tests
tests:
  - it: renders no Ingress by default
    templates:
      - templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Ingress when ingress.enabled=true
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-ingress
      - equal:
          path: spec.ingressClassName
          value: ontoserver-nginx

  - it: Ingress rules use hostNames
    templates:
      - templates/ingress.yaml
    set:
      ontoserver.ingress.enabled: true
      ontoserver.hostNames:
        - myserver.example.com
      ontoserver.serverName: myserver.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: myserver.example.com

  - it: renders no Gateway by default
    templates:
      - templates/gateway.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Gateway when gateway.enabled=true
    templates:
      - templates/gateway.yaml
    set:
      ontoserver.gateway.enabled: true
    asserts:
      - isKind:
          of: Gateway
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gw
        documentIndex: 0
      - isKind:
          of: HTTPRoute
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-route
        documentIndex: 1

  - it: renders ClusterIP Service by default
    templates:
      - templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-service
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
      - equal:
          path: spec.type
          value: ClusterIP
