suite: existingSecretConfig tests
templates:
  - templates/deployment.yaml
  - templates/statefulset.yaml
  # Needed by the last test: a test-level `templates:` override still has to be declared here.
  - templates/secret.yaml
tests:
  # `envFrom` must not appear at all when neither secret source is in use — an empty envFrom list
  # is rejected by the API server.
  - it: adds no envFrom by default
    template: templates/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].envFrom

  - it: injects the named Secret via envFrom on the Deployment
    template: templates/deployment.yaml
    set:
      ontoserver.existingSecretConfig: my-external-secret
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-external-secret
      # The name is used verbatim — it refers to a Secret the chart does not own, so it must not be
      # prefixed with the release name the way chart-created Secrets are.
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-ontoserver-secrets

  - it: injects the named Secret via envFrom on the StatefulSet
    template: templates/statefulset.yaml
    values:
      - fixtures/scaled-values.yaml
    set:
      ontoserver.existingSecretConfig: my-external-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-external-secret

  # Both sources together is a legitimate configuration — External Secrets for the credentials it
  # syncs, plus a hand-managed Secret for everything else. Order matters to Kubernetes: later
  # envFrom entries win a key collision, so the chart's own ESO Secret must come first and the
  # caller's Secret must be able to override it.
  - it: renders both secret sources with the chart's own first
    template: templates/deployment.yaml
    set:
      ontoserver.existingSecretConfig: my-external-secret
      ontoserver.externalSecret.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 2
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-ontoserver-external-secrets
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: my-external-secret

  # The chart must not try to create the Secret it was only told the name of.
  - it: does not create a Secret for existingSecretConfig
    templates:
      - templates/secret.yaml
    set:
      ontoserver.existingSecretConfig: my-external-secret
    asserts:
      - hasDocuments:
          count: 0
