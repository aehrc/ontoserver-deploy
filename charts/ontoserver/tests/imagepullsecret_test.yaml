suite: Image pull secret tests
templates:
  - templates/imagepullsecret.yaml
  - templates/imagepullsecretexternal.yaml
tests:
  - it: renders no pull secret without credentials
    template: templates/imagepullsecret.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Both halves are required — a username with no password would produce a Secret the kubelet
  # cannot authenticate with.
  - it: renders no pull secret with only a username
    template: templates/imagepullsecret.yaml
    set:
      ontoserver.imageCredentials.username: myuser
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no pull secret with only a password
    template: templates/imagepullsecret.yaml
    set:
      ontoserver.imageCredentials.password: mypass
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a dockerconfigjson secret when both are set
    template: templates/imagepullsecret.yaml
    set:
      ontoserver.imageCredentials.username: myuser
      ontoserver.imageCredentials.password: mypass
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-pull-secret
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: ontoserver
      # An isNotEmpty assertion would pass against corrupt JSON, which is precisely the bug this
      # template had. Pin the exact base64 so the content is asserted. Decodes to:
      #   {"auths":{"quay.io":{"auth":"bXl1c2VyOm15cGFzcw==","password":"mypass","username":"myuser"}}}
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJxdWF5LmlvIjp7ImF1dGgiOiJiWGwxYzJWeU9tMTVjR0Z6Y3c9PSIsInBhc3N3b3JkIjoibXlwYXNzIiwidXNlcm5hbWUiOiJteXVzZXIifX19

  # The regression case. The template used to interpolate credentials into a JSON string literal
  # with printf, so a single `"` or `\` in either field produced a corrupt .dockerconfigjson. The
  # kubelet surfaces that only as an opaque ImagePullBackOff, with the parse error buried in the
  # node log. dict + toJson escapes both correctly.
  #
  # username: us"er   password: pa\ss"wd
  # Decodes to:
  #   {"auths":{"quay.io":{"auth":"dXMiZXI6cGFcc3Mid2Q=","password":"pa\\ss\"wd","username":"us\"er"}}}
  # The quote is backslash-escaped and the backslash doubled, while `auth` base64-decodes to the
  # raw `us"er:pa\ss"wd` with no escaping — which is what the Docker config format requires.
  - it: escapes quotes and backslashes in credentials
    template: templates/imagepullsecret.yaml
    set:
      ontoserver.imageCredentials.username: 'us"er'
      ontoserver.imageCredentials.password: 'pa\ss"wd'
    asserts:
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJxdWF5LmlvIjp7ImF1dGgiOiJkWE1pWlhJNmNHRmNjM01pZDJRPSIsInBhc3N3b3JkIjoicGFcXHNzXCJ3ZCIsInVzZXJuYW1lIjoidXNcImVyIn19fQ==

  - it: honours a custom registry
    template: templates/imagepullsecret.yaml
    set:
      ontoserver.imageCredentials.registry: myregistry.example.com
      ontoserver.imageCredentials.username: myuser
      ontoserver.imageCredentials.password: mypass
    asserts:
      # The registry is the JSON object key, so toJson escapes it as well.
      - notEqual:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJxdWF5LmlvIjp7ImF1dGgiOiJiWGwxYzJWeU9tMTVjR0Z6Y3c9PSIsInBhc3N3b3JkIjoibXlwYXNzIiwidXNlcm5hbWUiOiJteXVzZXIifX19
      - matchRegex:
          path: data[".dockerconfigjson"]
          pattern: ^[A-Za-z0-9+/]+=*$

  # --- External Secrets variant ---
  #
  # This path is not exercised by the integration tests (they run without External Secrets
  # installed), so the rendered ExternalSecret is all that can be asserted here.

  - it: renders no external pull secret unless both remote keys are given
    template: templates/imagepullsecretexternal.yaml
    set:
      ontoserver.externalSecret.imagePullSecret.data.username.key: onto/user
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret targeting a dockerconfigjson secret
    template: templates/imagepullsecretexternal.yaml
    set:
      ontoserver.externalSecret.imagePullSecret.data.username.key: onto/user
      ontoserver.externalSecret.imagePullSecret.data.password.key: onto/pass
      ontoserver.externalSecret.imagePullSecret.secretStoreRef.name: my-store
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ontoserver-pull-secret-external-sync
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-ontoserver-pull-secret-external
      - equal:
          path: spec.target.template.type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: spec.secretStoreRef.name
          value: my-store

  # The placeholders must reach External Secrets unquoted and piped through toJson: toJson
  # supplies its own quotes and escapes any `"` or `\` in the retrieved value. Hand-quoting them
  # — as this template used to — corrupts the .dockerconfigjson for such a password, in the same
  # way the chart-rendered secret above did.
  - it: pipes the external credential placeholders through toJson
    template: templates/imagepullsecretexternal.yaml
    set:
      ontoserver.externalSecret.imagePullSecret.data.username.key: onto/user
      ontoserver.externalSecret.imagePullSecret.data.password.key: onto/pass
      ontoserver.externalSecret.imagePullSecret.secretStoreRef.name: my-store
    asserts:
      - equal:
          path: spec.target.template.data[".dockerconfigjson"]
          value: |
            {"auths":{ "quay.io": {"username":{{ .username | toJson }},"password":{{ .password | toJson }}} }}
      # Guards against a reintroduction of the hand-quoted form, which would read
      # "username":"{{ .username }}".
      - notMatchRegex:
          path: spec.target.template.data[".dockerconfigjson"]
          pattern: '"\{\{ \.(username|password) \}\}"'

  - it: falls back to the shared secretStoreRef for the pull secret
    template: templates/imagepullsecretexternal.yaml
    set:
      ontoserver.externalSecret.secretStoreRef.name: shared-store
      ontoserver.externalSecret.secretStoreRef.kind: SecretStore
      ontoserver.externalSecret.imagePullSecret.data.username.key: onto/user
      ontoserver.externalSecret.imagePullSecret.data.password.key: onto/pass
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: shared-store
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore

  - it: fails when no secret store can be resolved for the pull secret
    template: templates/imagepullsecretexternal.yaml
    set:
      ontoserver.externalSecret.imagePullSecret.data.username.key: onto/user
      ontoserver.externalSecret.imagePullSecret.data.password.key: onto/pass
    asserts:
      - failedTemplate:
          errorMessage: "ontoserver.externalSecret.imagePullSecret: secretStoreRef.name (or ontoserver.externalSecret.secretStoreRef.name) is required"
