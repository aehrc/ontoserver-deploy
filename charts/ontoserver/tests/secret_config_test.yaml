suite: secretConfig tests
templates:
  - templates/secret.yaml
tests:
  - it: creates no Secret when secretConfig is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: base64-encodes string values
    set:
      ontoserver.secretConfig:
        spring.datasource.password: s3cret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data["spring.datasource.password"]
          value: czNjcmV0        # "s3cret"

  # Regression test. `b64enc` rejects non-strings outright, so a numeric or boolean entry used to
  # fail the whole render with `wrong type for value; expected string; got int64` — and the error
  # named only `<b64enc>`, not the key at fault. These are ordinary things to put in Ontoserver
  # config (a port, a `spring.*.enabled` flag), and the sibling `ontoserver.config` accepts them.
  - it: coerces a numeric value instead of failing to render
    set:
      ontoserver.secretConfig:
        spring.datasource.port: 5432
    asserts:
      - equal:
          path: data["spring.datasource.port"]
          value: NTQzMg==        # "5432" — not "5432.0"

  - it: coerces a boolean value instead of failing to render
    set:
      ontoserver.secretConfig:
        some.feature.enabled: true
    asserts:
      - equal:
          path: data["some.feature.enabled"]
          value: dHJ1ZQ==        # "true"

  - it: encodes mixed value types in one Secret
    set:
      ontoserver.secretConfig:
        a.string: hello
        an.int: 5432
        a.bool: false
    asserts:
      - equal:
          path: data["a.string"]
          value: aGVsbG8=        # "hello"
      - equal:
          path: data["an.int"]
          value: NTQzMg==        # "5432"
      - equal:
          path: data["a.bool"]
          value: ZmFsc2U=        # "false"

  # A quoted numeric string must keep its leading zero. This is the case that distinguishes
  # coercion from re-parsing: "0123" is a plausible secret and must not become "123".
  - it: preserves a quoted numeric string verbatim
    set:
      ontoserver.secretConfig:
        a.numeric.string: "0123"
    asserts:
      - equal:
          path: data["a.numeric.string"]
          value: MDEyMw==        # "0123"
