suite: Config checksum annotation tests
templates:
  - templates/deployment.yaml
  - templates/statefulset.yaml
tests:
  # Nothing to hash by default: secretConfig is empty and externalSecret is disabled, so the
  # whole annotations block should stay absent rather than render empty.
  - it: adds no checksum annotations when there is no secret configuration
    template: templates/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  - it: adds a secret-config checksum to the Deployment pod template
    template: templates/deployment.yaml
    set:
      ontoserver.secretConfig.spring\.datasource\.password: hunter2
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret-config"]
          pattern: ^[0-9a-f]{64}$

  - it: adds a secret-config checksum to the StatefulSet pod template
    template: templates/statefulset.yaml
    values:
      - fixtures/scaled-values.yaml
    set:
      ontoserver.secretConfig.spring\.datasource\.password: hunter2
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret-config"]
          pattern: ^[0-9a-f]{64}$

  # The two exact hashes below are the point of this file: a shape assertion alone would pass
  # even if the checksum were a constant. These two tests differ only in the secret value, so
  # they prove the annotation actually tracks the configuration. If the hash *input* is ever
  # changed deliberately, both literals must be recomputed — that is the intended friction.
  - it: derives the secret-config checksum from the secret values (a=one)
    template: templates/deployment.yaml
    set:
      ontoserver.secretConfig.a: one
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret-config"]
          value: b37bebf9efecebf1d95e1013f213ec7559dc554fcfe8f3d8dc0eeff25792318b

  - it: derives the secret-config checksum from the secret values (a=two)
    template: templates/deployment.yaml
    set:
      ontoserver.secretConfig.a: two
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret-config"]
          value: 88900203337ed18585feeacd6e5372b2bd4e94ee98d2e12b290b647a9dc37e3b

  # Deliberate design property, not an accident: the checksum hashes the values rather than the
  # rendered Secret, so bumping the chart version does not restart every Ontoserver pod. The
  # expected hash is the same literal as the a=one test above.
  - it: does not change the secret-config checksum when only the chart version changes
    template: templates/deployment.yaml
    chart:
      version: 9.9.9
    set:
      ontoserver.secretConfig.a: one
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret-config"]
          value: b37bebf9efecebf1d95e1013f213ec7559dc554fcfe8f3d8dc0eeff25792318b

  - it: adds an external-secret checksum when externalSecret is enabled
    template: templates/deployment.yaml
    set:
      ontoserver.externalSecret.enabled: true
      ontoserver.externalSecret.secretStoreRef.name: my-store
      ontoserver.externalSecret.data:
        - secretKey: spring.datasource.password
          remoteRef:
            key: onto/db
            property: password
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/external-secret"]
          pattern: ^[0-9a-f]{64}$
      # secretConfig is still empty, so only the one checksum belongs here.
      - isNull:
          path: spec.template.metadata.annotations["checksum/secret-config"]

  - it: changes the external-secret checksum when the requested keys change
    template: templates/deployment.yaml
    set:
      ontoserver.externalSecret.enabled: true
      ontoserver.externalSecret.secretStoreRef.name: my-store
      ontoserver.externalSecret.data:
        - secretKey: spring.datasource.password
          remoteRef:
            key: onto/db
            property: password
        - secretKey: extra.key
          remoteRef:
            key: onto/extra
    asserts:
      # Same value as the single-key test above would produce only if the data list were
      # ignored; asserting the exact hash of the two-key form pins that it is not.
      - equal:
          path: spec.template.metadata.annotations["checksum/external-secret"]
          value: 79abf20616f17d1cc7234af0fc58bb65ccbb881313a56edf7e266419da01aa9d

  # Pull-secret credentials are consumed only by the kubelet at image-pull time, so rotating
  # them must NOT roll the pods — they already hold the image.
  - it: does not add a checksum for image pull credentials
    template: templates/deployment.yaml
    set:
      ontoserver.imageCredentials.username: user
      ontoserver.imageCredentials.password: pass
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  # ontoserver.config is rendered straight into the pod template as env values, so it already
  # forces a rollout on its own and is deliberately excluded from the checksum.
  - it: does not add a checksum for plain config
    template: templates/deployment.yaml
    set:
      ontoserver.config.some\.setting: value
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  - it: keeps user podAnnotations alongside the checksums
    template: templates/deployment.yaml
    set:
      ontoserver.secretConfig.a: one
      ontoserver.deployment.podAnnotations:
        example.com/owner: platform-team
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: platform-team
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret-config"]
          pattern: ^[0-9a-f]{64}$
