{{- if and .Values.image.credentials.username .Values.image.credentials.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-indexer-pull-secret
type: kubernetes.io/dockerconfigjson
data:
  {{- /* Built with dict + toJson rather than printf — see the matching comment in the
       ontoserver chart's imagepullsecret.yaml. Interpolating credentials into a JSON string
       literal corrupts .dockerconfigjson when the password contains `"` or `\`, and the kubelet
       reports that only as an opaque ImagePullBackOff. */ -}}
  {{- $creds := .Values.image.credentials }}
  {{- $auth := printf "%s:%s" $creds.username $creds.password | b64enc }}
  {{- $config := dict "auths" (dict $creds.registry (dict "username" $creds.username "password" $creds.password "auth" $auth)) }}
  .dockerconfigjson: {{ $config | toJson | b64enc }}
{{- end }}
