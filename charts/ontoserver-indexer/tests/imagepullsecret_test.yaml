suite: imagepullsecret template tests
templates:
  - templates/imagepullsecret.yaml

tests:
  - it: renders no secret when credentials not set
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no secret when only username set
    set:
      image.credentials.username: myuser
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no secret when only password set
    set:
      image.credentials.password: mypass
    asserts:
      - hasDocuments:
          count: 0

  - it: renders pull secret when both username and password set
    set:
      image.credentials.username: myuser
      image.credentials.password: mypass
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-indexer-pull-secret
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      # isNotEmpty alone would pass against corrupt JSON, which is exactly the bug this
      # template had. Pin the exact base64 so the escaping is asserted, not just presence.
      # Decodes to:
      #   {"auths":{"quay.io":{"auth":"bXl1c2VyOm15cGFzcw==","password":"mypass","username":"myuser"}}}
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJxdWF5LmlvIjp7ImF1dGgiOiJiWGwxYzJWeU9tMTVjR0Z6Y3c9PSIsInBhc3N3b3JkIjoibXlwYXNzIiwidXNlcm5hbWUiOiJteXVzZXIifX19

  # The regression case. The template used to interpolate credentials into a JSON string literal
  # with printf, so a `"` or `\` in either field produced a corrupt .dockerconfigjson — the
  # kubelet reports that only as an opaque ImagePullBackOff. dict + toJson escapes both.
  #
  # username: us"er   password: pa\ss"wd
  # Decodes to:
  #   {"auths":{"quay.io":{"auth":"dXMiZXI6cGFcc3Mid2Q=","password":"pa\\ss\"wd","username":"us\"er"}}}
  # i.e. the quote is backslash-escaped and the backslash doubled, and `auth` base64-decodes to
  # the raw `us"er:pa\ss"wd` with no escaping, as the Docker config format requires.
  - it: escapes quotes and backslashes in credentials
    set:
      image.credentials.username: 'us"er'
      image.credentials.password: 'pa\ss"wd'
    asserts:
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJxdWF5LmlvIjp7ImF1dGgiOiJkWE1pWlhJNmNHRmNjM01pZDJRPSIsInBhc3N3b3JkIjoicGFcXHNzXCJ3ZCIsInVzZXJuYW1lIjoidXNcImVyIn19fQ==

  - it: honours a custom registry
    set:
      image.credentials.registry: myregistry.example.com
      image.credentials.username: myuser
      image.credentials.password: mypass
    asserts:
      # The registry is the JSON object key, so it is escaped by toJson too.
      - matchRegex:
          path: data[".dockerconfigjson"]
          pattern: ^[A-Za-z0-9+/]+=*$
      - notEqual:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJxdWF5LmlvIjp7ImF1dGgiOiJiWGwxYzJWeU9tMTVjR0Z6Y3c9PSIsInBhc3N3b3JkIjoibXlwYXNzIiwidXNlcm5hbWUiOiJteXVzZXIifX19

