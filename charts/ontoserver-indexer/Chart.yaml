apiVersion: v2
name: ontoserver-indexer
description: Runs a Kubernetes Job to index a SNOMED CT (or other) code system and publish to a syndication server
type: application
version: 0.2.0
appVersion: "ctsa-6"
home: https://ontoserver.csiro.au
icon: https://raw.githubusercontent.com/aehrc/ontoserver-deploy/master/icons/ontoserver-indexer.png
sources:
  - https://github.com/aehrc/ontoserver-deploy
keywords:
  - ontoserver
  - fhir
  - terminology
  - snomed
  - indexer
maintainers:
  - name: CSIRO
    email: ontoserver-support@csiro.au
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  # Describes the version in `version:` above — the last released version. Release Please bumps
  # `version:` but does NOT touch this list; update it in the release PR before merging.
  artifacthub.io/changes: |
    - kind: added
      description: resources.heapGb to size the JVM heap independently of the container memory limit
    - kind: fixed
      description: Registry credentials containing a quote or backslash no longer corrupt the image pull secret
    - kind: added
      description: Opt-in pod and container securityContext values for the indexer Job (unset by default)
