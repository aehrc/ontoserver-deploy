{{- if .Values.varnish.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-varnish-configmap
  labels:
    {{- include "ontoserver-extras.labels" . | nindent 4 }}
data:
  default.vcl: |
    vcl 4.1;

    import std;

    backend default {
        .host = "{{ .Values.varnish.backendServiceName | default (printf "%s-ontoserver-service" .Release.Name) }}";
        .port = "80";
        .connect_timeout = 60s;
        .first_byte_timeout = 60s;
        .between_bytes_timeout = 60s;
    }

    sub vcl_recv {
        {{- if .Values.varnish.opentelemetry.enabled }}
        set req.http.X-Start-Time-Sec = std.time2real(now, 0.0);

        set req.http.X-Start-Sec = regsub(req.http.X-Start-Time-Sec, "^([0-9]+)\..*", "\1");
        set req.http.X-Start-Frac = regsub(req.http.X-Start-Time-Sec, "^[0-9]+\.([0-9]*).*", "\1");

        # Pad fractional part to exactly 6 digits
        set req.http.X-Start-Frac = req.http.X-Start-Frac + "000000";
        set req.http.X-Start-Frac = regsub(req.http.X-Start-Frac, "^(.{6}).*", "\1");

        # Combine: seconds + 6-digit fractional = microseconds
        set req.http.X-Start-Time-Micros = req.http.X-Start-Sec + req.http.X-Start-Frac;

        # Generate Varnish span ID if we have a trace
        # Use x-request-id (UUID from Envoy) as span ID: strip dashes, take 16 hex chars.
        # Avoids REAL overflow from std.random() with large ranges (Varnish bug with 15-digit floats).
        if (req.http.traceparent || req.http.X-B3-TraceId) {
            if (req.http.x-request-id) {
                set req.http.X-Varnish-Span-Id = regsuball(req.http.x-request-id, "-", "");
                set req.http.X-Varnish-Span-Id = regsub(req.http.X-Varnish-Span-Id, "^(.{16}).*", "\1");
            } else {
                set req.http.X-Varnish-Span-Id =
                    regsub(std.random(10000000, 99999999), "\..*$", "") +
                    regsub(std.random(10000000, 99999999), "\..*$", "");
            }
        }

        # Preserve original trace headers
        if (req.http.traceparent) {
            set req.http.X-Original-Traceparent = req.http.traceparent;
            # Extract trace ID for logging
            set req.http.X-Trace-Id = regsub(req.http.traceparent, "^00-([a-f0-9]{32})-([a-f0-9]{16})-.*", "\1");
            set req.http.X-Parent-Span-Id = regsub(req.http.traceparent, "^00-([a-f0-9]{32})-([a-f0-9]{16})-.*", "\2");
        }

        # Handle B3 headers
        if (req.http.X-B3-TraceId) {
            set req.http.X-Trace-Id = req.http.X-B3-TraceId;
        }
        if (req.http.X-B3-SpanId) {
            set req.http.X-Parent-Span-Id = req.http.X-B3-SpanId;
        }
        if (req.http.X-B3-ParentSpanId) {
            set req.http.X-B3-Parent-Span-Id = req.http.X-B3-ParentSpanId;
        }
        if (req.http.X-B3-Sampled) {
            set req.http.X-Sampled = req.http.X-B3-Sampled;
        }
        {{- end }}

        # Remove cookies for static content
        if (req.url ~ "\.(css|js|png|gif|jp(e)?g|swf|ico|woff|woff2|svg)$") {
            unset req.http.Cookie;
        }

        {{- if .Values.varnish.cache.passAuthHeaderRequests }}
        if (req.http.Authorization) {
           return (pass);
        }
        {{- end }}

        if (req.method != "GET" && req.method != "HEAD") {
            return (pass);
        }

        if (req.url ~ "^/fhir/" && req.http.Accept-Language) {
            set req.http.X-Norm-Accept-Language =
                regsub(req.http.Accept-Language, "^([^,;]+).*$", "\1");
        }
        if (req.url ~ "^/fhir/" && req.http.Accept) {
            set req.http.X-Norm-Accept =
                regsub(req.http.Accept, "^([^,;]+).*$", "\1");
        }

        return (hash);
    }

    sub vcl_hash {
        hash_data(req.url);

        if (req.http.host) {
            hash_data(req.http.host);
        } else {
            hash_data(server.ip);
        }

        # Only add variant keys when we set them in vcl_recv
        if (req.http.X-Norm-Accept-Language) {
            hash_data(req.http.X-Norm-Accept-Language);
        }
        if (req.http.X-Norm-Accept) {
            hash_data(req.http.X-Norm-Accept);
        }

        return (lookup);
    }

    {{- if .Values.varnish.opentelemetry.enabled }}
    sub vcl_backend_fetch {
        # Create new traceparent with Varnish span as parent for backend requests
        if (bereq.http.X-Original-Traceparent && bereq.http.X-Varnish-Span-Id) {
            set bereq.http.traceparent = "00-" +
                bereq.http.X-Trace-Id + "-" +
                bereq.http.X-Varnish-Span-Id + "-01";
        }

        # Forward B3 headers with Varnish as parent
        if (bereq.http.X-Trace-Id) {
            set bereq.http.X-B3-TraceId = bereq.http.X-Trace-Id;
        }
        if (bereq.http.X-Varnish-Span-Id) {
            set bereq.http.X-B3-ParentSpanId = bereq.http.X-Varnish-Span-Id;
        }
        if (bereq.http.X-Sampled) {
            set bereq.http.X-B3-Sampled = bereq.http.X-Sampled;
        }
    }
    {{- end }}

    sub vcl_backend_response {
        if (beresp.status == 200) {
            # Ignore any Cache-Control/Pragma no-cache directives from the origin
            # (mirrors Azure CDN "Ignore Origin No-Cache = 200" rule)
            unset beresp.http.Cache-Control;
            unset beresp.http.Pragma;
            set beresp.ttl = {{ .Values.varnish.cache.time200 }};
        }
        if (beresp.status == 404) {
            set beresp.ttl = {{ .Values.varnish.cache.time404 }};
        }

        # Optional: allow a separate TTL for $expand, fallback to time200 if not set
        if (bereq.url ~ "^/fhir/ValueSet/\\$expand" && beresp.status == 200) {
            set beresp.ttl = {{ default .Values.varnish.cache.time200 .Values.varnish.cache.timeExpand }};
        }

        if (bereq.url ~ "^/fhir/") {
            if (!beresp.http.Vary) {
                set beresp.http.Vary = "Accept-Language, Accept";
            } else {
                if (beresp.http.Vary !~ "(?i)Accept-Language") {
                    set beresp.http.Vary = beresp.http.Vary + ", Accept-Language";
                }
                if (beresp.http.Vary !~ "(?i)Accept") {
                    set beresp.http.Vary = beresp.http.Vary + ", Accept";
                }
            }
        }

        if (beresp.http.Set-Cookie) {
            set beresp.uncacheable = true;
            return (deliver);
        }

        return (deliver);
    }

    sub vcl_deliver {
        if (obj.hits > 0) {
            set resp.http.X-Cache = "HIT";
            set resp.http.X-Cache-Hits = obj.hits;
        } else {
            set resp.http.X-Cache = "MISS";
        }
        set resp.http.X-Cache-Age = obj.age;

        # Prevent browsers from caching FHIR responses locally —
        # all caching is handled by Varnish (mirrors Azure CDN "Force Internal Max-Age = 0")
        if (req.url ~ "^/fhir/") {
            set resp.http.Cache-Control = "no-cache, no-store";
        }

        {{- if .Values.varnish.opentelemetry.enabled }}
        if (req.http.X-Trace-Id && req.http.X-Varnish-Span-Id) {
            set resp.http.traceparent = "00-" +
                req.http.X-Trace-Id + "-" +
                req.http.X-Varnish-Span-Id + "-01";
        }
        {{- end }}

        unset resp.http.Server;
        unset resp.http.Via;
        unset resp.http.X-Varnish;
        unset resp.http.X-Powered-By;

        {{- if .Values.varnish.opentelemetry.enabled }}
        if (req.http.X-Trace-Id && req.http.X-Start-Time-Micros) {
            set req.http.X-End-Time-Sec = std.time2real(now, 0.0);
            set req.http.X-End-Sec = regsub(req.http.X-End-Time-Sec, "^([0-9]+)\..*", "\1");
            set req.http.X-End-Frac = regsub(req.http.X-End-Time-Sec, "^[0-9]+\.([0-9]*).*", "\1");

            # Pad fractional part to exactly 6 digits
            set req.http.X-End-Frac = req.http.X-End-Frac + "000000";
            set req.http.X-End-Frac = regsub(req.http.X-End-Frac, "^(.{6}).*", "\1");

            # Combine: seconds + 6-digit fractional = microseconds
            set req.http.X-End-Time-Micros = req.http.X-End-Sec + req.http.X-End-Frac;

            std.log(
              "OTEL_SPAN: " +
              "trace_id="        + req.http.X-Trace-Id       + " " +
              "span_id="         + req.http.X-Varnish-Span-Id + " " +
              "parent_span_id="  + req.http.X-Parent-Span-Id  + " " +
              "service=varnish-cache " +
              "operation=cache_lookup " +
              "http.method="     + req.method    + " " +
              "http.url="        + req.url       + " " +
              "http.status_code=" + resp.status  + " " +
              "cache.status="    + resp.http.X-Cache   + " " +
              "start_time="      + req.http.X-Start-Time-Micros + " " +
              "end_time="        + req.http.X-End-Time-Micros
            );

            # Clean up temporary headers
            unset req.http.X-End-Time-Sec;
            unset req.http.X-End-Sec;
            unset req.http.X-End-Frac;
            unset req.http.X-End-Time-Micros;
        }

        # Always clean up start time headers
        unset req.http.X-Start-Time-Sec;
        unset req.http.X-Start-Sec;
        unset req.http.X-Start-Frac;
        unset req.http.X-Start-Time-Micros;
        {{- end }}
        unset req.http.X-Norm-Accept-Language;
        unset req.http.X-Norm-Accept;

        return (deliver);
    }

    sub vcl_backend_error {
        set beresp.ttl = 0s;

        set beresp.http.Content-Type = "text/html; charset=utf-8";
        synthetic({"<!DOCTYPE html>
          <html lang='en'>
          <head>
          <meta charset='UTF-8'>
          <meta name='viewport' content='width=device-width, initial-scale=1.0'>
          <title>503 - Service Temporarily Unavailable</title>
          <style>
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
          *{margin:0;padding:0;box-sizing:border-box;}
          body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:white;}
          .container{text-align:center;max-width:500px;padding:2rem;}
          .error-code{font-size:4rem;font-weight:700;margin-bottom:1rem;color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,0.3);}
          .title{font-size:1.8rem;font-weight:600;margin-bottom:1rem;color:#e0e0e0;}
          .subtitle{font-size:1rem;margin-bottom:2rem;color:#a0a0a0;line-height:1.4;}
          .retry-btn{background:linear-gradient(45deg,#4a5568,#2d3748);color:#fff;border:2px solid #ff6b6b;padding:12px 24px;font-size:1rem;font-weight:600;border-radius:25px;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(255,107,107,0.2);display:inline-flex;align-items:center;gap:8px;}
          .retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,107,0.4);background:linear-gradient(45deg,#2d3748,#1a202c);}
          .footer{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#666;font-size:0.85rem;}
          @media (max-width:600px){.container{padding:1rem;}.error-code{font-size:3rem;}.title{font-size:1.5rem;}.subtitle{font-size:0.9rem;}}
          </style>
          </head>
          <body>
          <div class='container'>
          <div class='error-code'>503</div>
          <h1 class='title'>Oops! We're Unplugged</h1>
          <p class='subtitle'>Our servers seem to have lost their connection. We're plugging things back in as fast as we can!</p>
          <button class='retry-btn' onclick='location.reload()'><span>Reconnect</span></button>
          </div>
          <div class='footer'>Powered by CSIRO Ontoserver</div>
          </body>
          </html>"});
        return (deliver);
    }
{{- end }}
