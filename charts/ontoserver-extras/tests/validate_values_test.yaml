suite: validate-values tests
templates:
  - templates/validate-values.yaml
tests:
  - it: passes with default values
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when collector enabled without any exporter endpoint
    set:
      collector.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "collector requires at least one of collector.otlpEndpoint or collector.zipkinEndpoint"

  - it: passes when collector enabled with otlpEndpoint
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - hasDocuments:
          count: 0

  - it: passes when collector enabled with zipkinEndpoint
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when varnish.opentelemetry.enabled without varnish.enabled
    set:
      varnish.opentelemetry.enabled: true
      varnish.opentelemetry.collectorEndpoint: "http://collector/api/v2/spans"
    asserts:
      - failedTemplate:
          errorMessage: "varnish.opentelemetry.enabled requires varnish.enabled"

  - it: passes when varnish.opentelemetry.enabled with all required values
    set:
      varnish.enabled: true
      varnish.opentelemetry.enabled: true
      varnish.opentelemetry.collectorEndpoint: "http://collector/api/v2/spans"
    asserts:
      - hasDocuments:
          count: 0

  # A zero batch timeout disables the flush timer instead of meaning "flush immediately", so it
  # silently stops traces shipping on a quiet server. Rejected because no caller wants that; the
  # collector's own default is 200ms. Any unit is caught, since 0ms is the same trap as 0s.
  - it: fails when collector.batch.timeout is zero seconds
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
      collector.batch.timeout: 0s
    asserts:
      - failedTemplate:
          errorMessage: 'collector.batch.timeout must not be zero (got "0s") — a zero timeout disables the batch flush timer, so spans are held until collector.batch.sendBatchSize accumulates and on a quiet server traces never ship. Use a real duration such as 5s.'

  - it: fails when collector.batch.timeout is zero in any other unit
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
      collector.batch.timeout: 0ms
    asserts:
      - failedTemplate: {}

  # Not validated when the collector is off — the value is unused, so failing would block an
  # unrelated install.
  - it: ignores the batch timeout when the collector is disabled
    set:
      collector.batch.timeout: 0s
    asserts:
      - hasDocuments:
          count: 0

  - it: passes with a sub-second timeout that is not zero
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
      collector.batch.timeout: 200ms
    asserts:
      - hasDocuments:
          count: 0
