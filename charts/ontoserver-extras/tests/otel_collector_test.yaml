suite: OpenTelemetry Collector tests
templates:
  - templates/otel-collector.yaml
tests:
  - it: renders nothing when collector disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an OpenTelemetryCollector when collector enabled with otlpEndpoint
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - hasDocuments:
          count: 1

  - it: names the collector correctly
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-otel-collector

  - it: includes otlp exporter when otlpEndpoint set
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - isNotNull:
          path: spec.config.exporters.otlp

  - it: sets otlp exporter endpoint
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - equal:
          path: spec.config.exporters.otlp.endpoint
          value: "http://otel-collector:4317"

  - it: includes zipkin exporter when zipkinEndpoint set
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
    asserts:
      - isNotNull:
          path: spec.config.exporters.zipkin

  - it: sets zipkin exporter endpoint
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
    asserts:
      - equal:
          path: spec.config.exporters.zipkin.endpoint
          value: "http://zipkin:9411/api/v2/spans"

  - it: omits otlp exporter when otlpEndpoint not set
    set:
      collector.enabled: true
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
    asserts:
      - isNull:
          path: spec.config.exporters.otlp

  - it: omits zipkin exporter when zipkinEndpoint not set
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - isNull:
          path: spec.config.exporters.zipkin

  - it: includes debug exporter when debug enabled
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
      collector.debug: true
    asserts:
      - isNotNull:
          path: spec.config.exporters.debug

  - it: omits debug exporter when debug disabled
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
    asserts:
      - isNull:
          path: spec.config.exporters.debug

  - it: sets tolerations when provided
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
      collector.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "otel"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.tolerations[0].key
          value: "dedicated"

  - it: includes both otlp and zipkin in pipeline exporters when both endpoints set
    set:
      collector.enabled: true
      collector.otlpEndpoint: "http://otel-collector:4317"
      collector.zipkinEndpoint: "http://zipkin:9411/api/v2/spans"
    asserts:
      - contains:
          path: spec.config.service.pipelines.traces.exporters
          content: otlp
      - contains:
          path: spec.config.service.pipelines.traces.exporters
          content: zipkin
