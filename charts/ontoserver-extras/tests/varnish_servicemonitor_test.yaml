suite: Varnish ServiceMonitor tests
templates:
  - templates/varnish-servicemonitor.yaml
tests:
  - it: renders nothing when varnish disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when varnish enabled but metrics disabled
    set:
      varnish.enabled: true
      varnish.metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor when varnish and metrics enabled
    set:
      varnish.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - hasDocuments:
          count: 1

  - it: names the ServiceMonitor correctly
    set:
      varnish.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-varnish-metrics

  - it: uses metrics interval from values
    set:
      varnish.enabled: true
      varnish.metrics.interval: 30s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  - it: uses metrics scrapeTimeout from values
    set:
      varnish.enabled: true
      varnish.metrics.scrapeTimeout: 25s
    asserts:
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 25s

  - it: sets metrics endpoint port
    set:
      varnish.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: metrics
