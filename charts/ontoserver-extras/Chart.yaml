apiVersion: v2
name: ontoserver-extras
description: Optional infrastructure components for Ontoserver (Varnish cache,
  OpenTelemetry Collector)
type: application
version: 0.2.0
appVersion: "ctsa-6"
home: https://ontoserver.csiro.au
icon: https://raw.githubusercontent.com/aehrc/ontoserver-deploy/master/icons/ontoserver-extras.png
sources:
  - https://github.com/aehrc/ontoserver-deploy
keywords:
  - fhir
  - terminology
  - ontoserver
  - varnish
  - opentelemetry
maintainers:
  - name: CSIRO
    email: ontoserver-support@csiro.au
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  # Describes the version in `version:` above. Keep in step with the changelog's [Unreleased].
  artifacthub.io/changes: |
    - kind: fixed
      description: Varnish now restarts when the VCL changes (checksum/config pod annotation)
    - kind: fixed
      description: Traces now ship on a quiet server; the batch processor had a zero flush timeout
    - kind: added
      description: Opt-in pod and container securityContext values for the Varnish pod (unset by default)
    - kind: added
      description: Readiness and liveness probes on the varnish container
    - kind: added
      description: securityContext passthrough for the OpenTelemetry Collector CR
