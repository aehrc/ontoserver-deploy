name: Release

on:
  push:
    tags:
      - 'ontoserver-v*'
      - 'ontoserver-extras-v*'
      - 'ontoserver-indexer-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-charts:
    name: Release Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish artifacthub-repo.yml to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout ${{ github.sha }} -- artifacthub-repo.yml
          git add artifacthub-repo.yml
          git diff --staged --quiet || git commit -m "Update artifacthub-repo.yml [skip ci]"
          git push origin gh-pages

  push-charts-oci:
    name: Push Helm Charts to OCI
    runs-on: ubuntu-latest
    needs: release-charts
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract chart name and version from tag
        id: chart
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "chart=${tag%-v*}" >> $GITHUB_OUTPUT
          echo "version=${tag#*-v}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          chart="${{ steps.chart.outputs.chart }}"
          version="${{ steps.chart.outputs.version }}"
          helm dependency build charts/$chart
          helm package charts/$chart -d charts-pkg
          helm push charts-pkg/$chart-$version.tgz oci://ghcr.io/aehrc
