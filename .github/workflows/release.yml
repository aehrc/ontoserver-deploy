name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-charts:
    name: Release Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  push-charts-oci:
    name: Push Helm Charts to OCI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package and push charts
        run: |
          helm package charts/ontoserver
          helm package charts/ontoserver-extras
          helm package charts/ontoserver-indexer
          helm push ontoserver-*.tgz oci://ghcr.io/aehrc
          helm push ontoserver-extras-*.tgz oci://ghcr.io/aehrc
          helm push ontoserver-indexer-*.tgz oci://ghcr.io/aehrc

  release-varnish-exporter:
    name: Build and Push varnish-exporter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push varnish-exporter
        uses: docker/build-push-action@v6
        with:
          context: docker/varnish-exporter
          push: true
          tags: |
            ghcr.io/aehrc/varnish-exporter:${{ steps.version.outputs.tag }}
            ghcr.io/aehrc/varnish-exporter:latest
